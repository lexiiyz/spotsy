services:
  db:
    image: postgres:16-alpine
    container_name: spotsy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: spotsy_db
      POSTGRES_USER: spotsy_user
      POSTGRES_PASSWORD: spotsy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: spotsy_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@spotsy.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - db

  spotsy-backend:
    build:
      context: ./spotsy-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://spotsy_user:spotsy_password@db:5432/spotsy_db
    depends_on:
      - db
    restart: unless-stopped

  spotsy-frontend:
    build:
      context: ./spotsy-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://spotsy-backend:8000
    depends_on:
      - spotsy-backend
    restart: unless-stopped

volumes:
  postgres_data:
