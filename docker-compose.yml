version: '3.8'

services:
  spotsy-backend:
    build:
      context: ./spotsy-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  spotsy-frontend:
    build:
      context: ./spotsy-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://spotsy-backend:8000
    depends_on:
      - spotsy-backend
    restart: unless-stopped
